<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Site</title>
    <!-- 引入 Animate.css 动效库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            max-width: 600px;
            text-align: center;
            padding: 40px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            border: 3px solid rgba(255, 255, 255, 0.4);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .links a {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .links a:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 50px;
            opacity: 0.5;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container animate__animated animate__fadeInUp">
        <div class="avatar animate__animated animate__bounceIn">👋</div>
        <h1 class="animate__animated animate__fadeInLeft">Hello 大琪琪</h1>
        <p class="subtitle animate__animated animate__fadeInRight">这是我的第一个静态网站 🎉</p>
        <p>通过 GitHub Pages 免费部署上线</p>
        <div class="links">
            <a href="https://github.com/LeafLuR">GitHub</a>
            <a href="mailto:wb_lurongjian@kuaishou.com">联系我</a>
        </div>
        <p class="footer">© 2025 LeafLuR · Powered by GitHub Pages</p>
    </div>
</body>
</html>
